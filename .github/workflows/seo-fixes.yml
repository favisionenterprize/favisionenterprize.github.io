# Puts the SEO fixes Alexander approved in the admin ("SEO & AI" → Apply fix, saved in
# data/seo-fixes.json) into the pages (scripts/seo_build.py), refreshes the own-site part of
# data/seo-report.json, commits and republishes the site.
name: Apply SEO fixes

on:
  push:
    branches: [main]
    paths:
      - "data/seo-fixes.json"
      - "scripts/seo_build.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: seo-fixes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inject the fixes and re-check our pages
        run: |
          python3 scripts/seo_build.py
          python3 scripts/seo_watch.py --no-net
      - name: Commit if anything changed
        id: commit
        run: |
          git add -A p index.html products studio tiktok videos sitemap.xml data/seo-report.json
          [ -f llms.txt ] && git add llms.txt
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply approved SEO fixes"
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet origin main && git push --quiet origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republish the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages will pick the change up on its next build"
