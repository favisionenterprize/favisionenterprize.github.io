function verifyPaystackWebhook(e) {
  const secret = PropertiesService.getScriptProperties().getProperty('PAYSTACK_SECRET');
  const hash = Utilities.computeHmacSha512Signature(e.postData.contents, secret)
    .map(b => ('0'+(b & 0xFF).toString(16)).slice(-2)).join('');
  if (hash !== e.headers['x-paystack-signature']) throw new Error('Invalid signature');
  const data = JSON.parse(e.postData.contents);
  if (data.event === 'charge.success') {
    const order = {
      id: 'FAV-' + Date.now(),
      ref: data.data.reference,
      amount: data.data.amount / 100, // kobo -> GHS
      currency: data.data.currency,
      channel: data.data.channel, // mobile_money
      paid: true,
      at: new Date().toISOString()
    };
    // append to data/orders.json via GitHub API
    saveOrder(order);
  }
  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
